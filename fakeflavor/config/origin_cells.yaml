# Origin route, asked one cell at a time: QCD vs ttbar at FIXED true source-jet
# flavor AND inside one (conePt, |eta|) cell of the fake-rate map.
#
#   python -m fakeflavor.train --target origin --flavor b \
#       --cell 10,20,0.0,0.9 --config fakeflavor/config/origin_cells.yaml ...
#
# Identical to origin.yaml except for the `evaluate` binning below — the
# weighting must not change, or the per-cell numbers stop being comparable to
# the inclusive ones in RESULTS.md §14.
#
# Why cells at all: the fake background is estimated with a FLAT FR map binned
# in exactly these two variables, so a QCD/ttbar difference that survives
# inside one cell is a difference the map cannot express. §14 measured this on
# the analysis binning (b 0.635-0.683, c 0.586-0.667 across 21 cells); this
# config is the coarse 4x3 version, where every cell is an exact union of
# analysis cells.

train:
  seed: 42
  use_gpu: true
  test_size: 0.20
  val_size: 0.20
  feature_set: full

  # Unchanged from origin.yaml, deliberately. class_balance is still the
  # load-bearing setting: inside a cell QCD outweighs TTLJ by roughly the same
  # five orders of magnitude as inclusively, so without it the fit sees a
  # handful of effective ttbar events. --cell is applied BEFORE build_weights
  # (train.py), so the balance and the clip are computed within the cell.
  physical_weight: true
  class_balance: true
  weight_clip_quantile: 0.999

  split_by_event: true

bdt:
  n_estimators: 1000
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 10
  gamma: 0.0
  reg_lambda: 1.0
  eval_metric: logloss        # binary target, not mlogloss
  early_stopping_rounds: 60
  # No lr_plateau block, deliberately: RESULTS.md §5 shows the schedule is a
  # structural no-op (the first LR drop always lands `patience` rounds AFTER
  # best_iteration, and the model is truncated there).

cv:
  n_splits: 5

evaluate:
  # The ONLY difference from origin.yaml. Coarse cells, chosen so that each one
  # is an exact union of analysis FR bins: [20,30), [30,50) and [50,100) are
  # analysis bins verbatim, and [10,20) is the union of [10,12) [12,14) [14,17)
  # [17,20). That makes the global-model numbers a direct cross-check against
  # the 21-cell table in plots/flavor_v3/eval.log rather than an approximate
  # one. conePt >= 100 (3.0% of the b slice, 3.8% of c) is not covered.
  #
  # A model trained with a matching --cell reports exactly one populated row
  # here, which is a free check that the filter did what it says.
  ptcorr_bins: [10., 20., 30., 50., 100.]
  abseta_bins: [0., 0.9, 1.6, 2.4]
